<!-- Square TabFlux mark for the browser tab and the docs site header: the disc, a
     table of three rows (the bottom one, held out, in neon) and the ML badge.
     Simplified from logo.svg so it stays recognisable at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TabFlux">
  <circle cx="32" cy="32" r="31" fill="#1b0f3d"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#8b6cff" stroke-width="2" opacity="0.6"/>
  <g>
    <rect x="13" y="17" width="18" height="8" rx="2" fill="#efe9ff" opacity="0.92"/>
    <rect x="34" y="17" width="17" height="8" rx="2" fill="#efe9ff" opacity="0.55"/>
    <rect x="13" y="28" width="17" height="8" rx="2" fill="#b9a6ff" opacity="0.75"/>
    <rect x="33" y="28" width="18" height="8" rx="2" fill="#b9a6ff" opacity="0.45"/>
    <rect x="13" y="39" width="18" height="8" rx="2" fill="#39ff14" opacity="0.95"/>
  </g>
  <circle cx="45" cy="48" r="13" fill="#1b0f3d"/>
  <text x="45" y="53" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="800" fill="#39ff14">ML</text>
</svg>
